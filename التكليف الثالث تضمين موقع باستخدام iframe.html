    <h1>التكليف الثالث ||iframe</h1>
    <hr>
   <div >
    <fieldset>
        <legend>أدخل معلوماتك أدناه:</legend>
        
        <form>
            <label>UserName:</label>
            <input type="text" placeholder="ادخل اسمك" style="width: 100px;">
            <br><br>

            <label>Password:</label>
            <input type="password" placeholder="ادخل كلمة المرور" style="width: 100px;">
            <br><br>

            <label>اختر تخصصك:</label> 
            <input type="radio" name="specialty" value="طب"> طب 
            <input type="radio" name="specialty" value="هندسة"> هندسة 
            <input type="radio" name="specialty" value="ادارة اعمال"> إدارة أعمال 
            <br><br>

            <label>اختر المواد الدراسية:</label> 
            <input type="checkbox" name="subject" value="لغة عربية"> لغة عربية 
            <input type="checkbox" name="subject" value="لغة انجليزية"> لغة إنجليزية 
            <input type="checkbox" name="subject" value="رياضيات"> رياضيات
            <br><br>

            <label>اختر تخصصك:</label>
            <select name="department">
                <option value="طب">طب</option>
                <option value="هندسة">هندسة</option>
                <option value="ادارة اعمال">إدارة أعمال</option>
            </select>
            <br><br>

            <input type="submit" value="إرسال البيانات">
        </form>
    </fieldset>
</div>
<hr>
